<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team App — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #12203B; --paper: #F7F6F2; --amber: #E8A33D;
    --slate: #6B7280; --line: #E4E1D8; --danger: #C0392B;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
  }
  .card {
    background: #fff; width: 320px; padding: 36px 32px; border-radius: 14px;
    border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(18,32,59,0.08);
  }
  .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--ink); margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  p.sub { color: var(--slate); font-size: 13px; margin: 0 0 22px; }
  label { font-size: 12px; font-weight: 600; color: var(--slate); display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; margin-bottom: 16px; border: 1px solid var(--line);
    border-radius: 8px; font-family: inherit; font-size: 14px; background: var(--paper);
  }
  input:focus { outline: 2px solid var(--amber); outline-offset: 1px; border-color: var(--amber); }
  button {
    width: 100%; padding: 12px; background: var(--ink); color: #fff; border: none;
    border-radius: 8px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #1a2d51; }
  #msg { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="mark"></div>
  <h1>Team App</h1>
  <p class="sub">Chat සහ location tracking</p>
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••">
  <button onclick="login()">Login</button>
  <p id="msg"></p>
</div>

<script>
const SUPABASE_URL = "https://eszwqhemtijsymeuwgus.supabase.co";
const SUPABASE_KEY = "sb_publishable_QO6S_RY2y6wCkMHwCc6_Pg_p8XjiVby";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.textContent = "";

  const { data, error } = await client.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = "Login අසාර්ථකයි: " + error.message; return; }
  window.location.href = "chat.html";
}

document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});

const params = new URLSearchParams(window.location.search);
const token = params.get('u');
if (token) {
  try {
    const [email, password] = atob(token).split(':');
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
    login();
  } catch (e) {}
}

client.auth.getSession().then(({ data }) => {
  if (data.session && !token) window.location.href = "chat.html";
});
</script>
</body>
</html>
