<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { background: #2b7de9; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; text-decoration: none; font-size: 14px; }
  #map { flex: 1; }
  #status { position: absolute; bottom: 10px; left: 10px; background: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; z-index: 1000; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
</style>
</head>
<body>
<header>
  <a href="chat.html">← Chat</a>
  <span>Team Map</span>
  <span></span>
</header>
<div id="map"></div>
<div id="status">Location: Starting...</div>

<script>
const SUPABASE_URL = "https://eszwqhemtijsymeuwgus.supabase.co";
const SUPABASE_KEY = "sb_publishable_QO6S_RY2y6wCkMHwCc6_Pg_p8XjiVby";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUserId = null;
let profileCache = {};
let map, markers = {};

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { window.location.href = "index.html"; return; }
  currentUserId = session.user.id;

  map = L.map('map').setView([7.8731, 80.7718], 8); // Sri Lanka center
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  await loadProfiles();
  await loadLatestLocations();
  subscribeRealtime();
  startWatchingMyLocation();
}

async function loadProfiles() {
  const { data } = await client.from('profiles').select('id, name');
  if (data) data.forEach(p => profileCache[p.id] = p.name);
}

async function loadLatestLocations() {
  const { data } = await client
    .from('locations')
    .select('*')
    .order('recorded_at', { ascending: false });
  if (!data) return;

  const seen = new Set();
  for (const loc of data) {
    if (seen.has(loc.user_id)) continue;
    seen.add(loc.user_id);
    updateMarker(loc);
  }
}

function updateMarker(loc) {
  const name = profileCache[loc.user_id] || 'Unknown';
  const isMe = loc.user_id === currentUserId;

  if (markers[loc.user_id]) {
    markers[loc.user_id].setLatLng([loc.lat, loc.lng]);
    markers[loc.user_id].setPopupContent(`${name}${isMe ? ' (ඔයා)' : ''}<br>${new Date(loc.recorded_at).toLocaleTimeString('si-LK')}`);
  } else {
    const marker = L.marker([loc.lat, loc.lng]).addTo(map)
      .bindPopup(`${name}${isMe ? ' (ඔයා)' : ''}<br>${new Date(loc.recorded_at).toLocaleTimeString('si-LK')}`);
    markers[loc.user_id] = marker;
  }
}

function subscribeRealtime() {
  client
    .channel('locations-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'locations' }, (payload) => {
      updateMarker(payload.new);
    })
    .subscribe();
}

function startWatchingMyLocation() {
  if (!navigator.geolocation) {
    document.getElementById('status').textContent = "Geolocation not supported";
    return;
  }

  navigator.geolocation.watchPosition(
    async (pos) => {
      const { latitude, longitude, accuracy, speed } = pos.coords;
      document.getElementById('status').textContent =
        `Location: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

      await client.from('locations').insert({
        user_id: currentUserId,
        lat: latitude,
        lng: longitude,
        accuracy: accuracy,
        speed: speed
      });
    },
    (err) => {
      document.getElementById('status').textContent = "Location error: " + err.message;
    },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
  );
}

init();
</script>
</body>
</html>
