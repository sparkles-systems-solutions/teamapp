<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink: #12203B; --paper: #F7F6F2; --amber: #E8A33D; --slate: #6B7280; --line: #E4E1D8; --success: #639922; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; }
  header { background: var(--ink); color: #fff; padding: 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
  header a { color: #fff; text-decoration: none; font-size: 12px; font-weight: 600; opacity: 0.85; margin-left: 10px; }
  #map-wrap { position: relative; flex: 1; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #status {
    position: absolute; bottom: 14px; left: 14px; right: 14px; background: #fff; padding: 8px 14px;
    border-radius: 12px; font-size: 11px; font-weight: 600; color: var(--ink); z-index: 1000;
    box-shadow: 0 2px 10px rgba(18,32,59,0.15); display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  #status.error .dot { background: #C0392B; }
  .stat { display: flex; align-items: center; gap: 4px; color: var(--slate); }
  .stat b { color: var(--ink); }
  .leaflet-popup-content { font-family: 'Inter', sans-serif; font-size: 12px; }
  .popup-btn { display: inline-block; margin-top: 6px; padding: 4px 10px; background: var(--ink); color: #fff; border-radius: 12px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
  .popup-meta { color: var(--slate); font-size: 11px; margin-top: 4px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <a href="chat.html">← Chat</a>
  <span>Team Map</span>
  <span><a href="admin.html">Admin →</a></span>
</header>
<div id="map-wrap">
  <div id="map"></div>
  <div id="status">
    <span class="dot"></span>
    <span class="stat" id="stat-status">Starting...</span>
    <span class="stat" id="stat-battery"></span>
    <span class="stat" id="stat-network"></span>
    <span class="stat" id="stat-time"></span>
  </div>
</div>

<script>
const SUPABASE_URL = "https://eszwqhemtijsymeuwgus.supabase.co";
const SUPABASE_KEY = "sb_publishable_QO6S_RY2y6wCkMHwCc6_Pg_p8XjiVby";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SEND_INTERVAL_MS = 20000;

let currentUserId = null;
let profileCache = {};
let map, markers = {};
let trails = {}; // userId -> L.Polyline
let lastSentAt = 0;
let myBatteryLevel = null, myBatteryCharging = null, myNetworkType = null;

function initials(name) {
  return (name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function makeIcon(name, isMe) {
  const color = isMe ? '#12203B' : '#E8A33D';
  const textColor = isMe ? '#fff' : '#12203B';
  return L.divIcon({
    html: `<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.3);"><span style="transform:rotate(45deg);color:${textColor};font-size:10px;font-weight:700;font-family:Inter,sans-serif;">${initials(name)}</span></div>`,
    className: '', iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30]
  });
}

function timeAgo(iso) {
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return diff + "s ago";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  return Math.floor(diff / 3600) + "h ago";
}

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { window.location.href = "index.html"; return; }
  currentUserId = session.user.id;

  map = L.map('map').setView([7.8731, 80.7718], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  await loadProfiles();
  await loadLatestLocations();
  subscribeRealtime();
  setupDeviceInfo();
  startWatchingMyLocation();

  const focusUserId = new URLSearchParams(window.location.search).get('focus');
  if (focusUserId && markers[focusUserId]) {
    map.setView(markers[focusUserId].getLatLng(), 14);
    markers[focusUserId].openPopup();
  }
}

function setupDeviceInfo() {
  // Battery (best-effort — not all browsers support this)
  if (navigator.getBattery) {
    navigator.getBattery().then(battery => {
      const update = () => {
        myBatteryLevel = Math.round(battery.level * 100);
        myBatteryCharging = battery.charging;
        document.getElementById('stat-battery').textContent = `🔋 ${myBatteryLevel}%${myBatteryCharging ? ' ⚡' : ''}`;
      };
      update();
      battery.addEventListener('levelchange', update);
      battery.addEventListener('chargingchange', update);
    }).catch(() => {});
  }

  // Network type (best-effort)
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (conn) {
    const update = () => {
      myNetworkType = conn.effectiveType || conn.type || null;
      document.getElementById('stat-network').textContent = myNetworkType ? `📶 ${myNetworkType.toUpperCase()}` : '';
    };
    update();
    conn.addEventListener('change', update);
  }
}

async function loadProfiles() {
  const { data } = await client.from('profiles').select('id, name');
  if (data) data.forEach(p => profileCache[p.id] = p.name);
}

async function loadLatestLocations() {
  const { data } = await client
    .from('locations')
    .select('*')
    .order('recorded_at', { ascending: false });
  if (!data) return;

  const seen = new Set();
  for (const loc of data) {
    if (seen.has(loc.user_id)) continue;
    seen.add(loc.user_id);
    updateMarker(loc);
  }
}

function popupContent(loc, name, isMe) {
  const battery = loc.battery != null ? `🔋 ${loc.battery}%` : '🔋 —';
  const network = loc.network ? `📶 ${loc.network.toUpperCase()}` : '📶 —';
  return `
    <b>${name}${isMe ? ' (ඔයා)' : ''}</b>
    <div class="popup-meta">
      🕐 ${timeAgo(loc.recorded_at)}<br>
      ${battery} &nbsp; ${network}
    </div>
    <div class="popup-btn" onclick="showTrail('${loc.user_id}')">Route History බලන්න</div>
  `;
}

function updateMarker(loc) {
  const name = profileCache[loc.user_id] || 'Unknown';
  const isMe = loc.user_id === currentUserId;
  const popupText = popupContent(loc, name, isMe);

  if (markers[loc.user_id]) {
    markers[loc.user_id].setLatLng([loc.lat, loc.lng]);
    markers[loc.user_id].setPopupContent(popupText);
    markers[loc.user_id]._loc = loc;
  } else {
    const marker = L.marker([loc.lat, loc.lng], { icon: makeIcon(name, isMe) }).addTo(map).bindPopup(popupText);
    marker._loc = loc;
    markers[loc.user_id] = marker;
  }
}

// ---- Location History (trail) ----
window.showTrail = async function(userId) {
  if (trails[userId]) {
    map.removeLayer(trails[userId]);
    delete trails[userId];
    return;
  }

  const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString();
  const { data } = await client
    .from('locations')
    .select('lat, lng, recorded_at')
    .eq('user_id', userId)
    .gte('recorded_at', twoHoursAgo)
    .order('recorded_at', { ascending: true })
    .limit(200);

  if (!data || data.length < 2) { alert("පසුගිය පැය 2ක් ඇතුළත history එකක් නැහැ"); return; }

  const latlngs = data.map(d => [d.lat, d.lng]);
  const color = userId === currentUserId ? '#12203B' : '#E8A33D';
  const line = L.polyline(latlngs, { color, weight: 3, opacity: 0.7, dashArray: '6,6' }).addTo(map);
  trails[userId] = line;
  map.fitBounds(line.getBounds(), { padding: [40, 40] });
};

function subscribeRealtime() {
  client
    .channel('locations-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'locations' }, (payload) => {
      updateMarker(payload.new);
    })
    .subscribe();
}

function startWatchingMyLocation() {
  const statusBox = document.getElementById('status');
  const statusText = document.getElementById('stat-status');
  const timeText = document.getElementById('stat-time');

  if (!navigator.geolocation) {
    statusBox.classList.add('error');
    statusText.textContent = "Geolocation not supported";
    return;
  }

  navigator.geolocation.watchPosition(
    async (pos) => {
      const now = Date.now();
      statusBox.classList.remove('error');

      if (now - lastSentAt < SEND_INTERVAL_MS) {
        const secsLeft = Math.ceil((SEND_INTERVAL_MS - (now - lastSentAt)) / 1000);
        statusText.textContent = `Active (next ${secsLeft}s)`;
        return;
      }
      lastSentAt = now;

      const { latitude, longitude, accuracy, speed } = pos.coords;
      statusText.textContent = `Active`;
      timeText.textContent = `🕐 ${new Date().toLocaleTimeString('si-LK', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

      await client.from('locations').insert({
        user_id: currentUserId,
        lat: latitude,
        lng: longitude,
        accuracy: accuracy,
        speed: speed,
        battery: myBatteryLevel,
        network: myNetworkType
      });
    },
    (err) => {
      statusBox.classList.add('error');
      statusText.textContent = "Error: " + err.message;
    },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
  );
}

init();
</script>
</body>
</html>
