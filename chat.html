<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f2f2f2; }
  header { background: #2b7de9; color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; text-decoration: none; font-size: 14px; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { background: #fff; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; max-width: 75%; }
  .msg .name { font-size: 12px; color: #2b7de9; font-weight: bold; }
  .msg .time { font-size: 10px; color: #999; float: right; }
  .mine { margin-left: auto; background: #dcf0ff; }
  #inputbar { display: flex; padding: 10px; background: #fff; }
  #inputbar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; }
  #inputbar button { margin-left: 8px; padding: 10px 16px; background: #2b7de9; color: #fff; border: none; border-radius: 20px; }
</style>
</head>
<body>
<header>
  <span>Team Chat</span>
  <a href="map.html">Map →</a>
</header>
<div id="messages"></div>
<div id="inputbar">
  <input type="text" id="msgInput" placeholder="Message එකක් ලියන්න...">
  <button onclick="sendMessage()">යවන්න</button>
</div>

<script>
const SUPABASE_URL = "https://eszwqhemtijsymeuwgus.supabase.co";
const SUPABASE_KEY = "sb_publishable_QO6S_RY2y6wCkMHwCc6_Pg_p8XjiVby";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUserId = null;
let profileCache = {};

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { window.location.href = "index.html"; return; }
  currentUserId = session.user.id;

  await loadProfiles();
  await loadMessages();
  subscribeRealtime();
}

async function loadProfiles() {
  const { data } = await client.from('profiles').select('id, name');
  if (data) data.forEach(p => profileCache[p.id] = p.name);
}

async function loadMessages() {
  const { data, error } = await client
    .from('messages')
    .select('*')
    .order('created_at', { ascending: true })
    .limit(100);
  if (data) data.forEach(renderMessage);
  scrollToBottom();
}

function renderMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg' + (m.user_id === currentUserId ? ' mine' : '');
  const name = profileCache[m.user_id] || 'Unknown';
  const time = new Date(m.created_at).toLocaleTimeString('si-LK', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<div class="name">${name}</div>${escapeHtml(m.body)}<span class="time">${time}</span>`;
  document.getElementById('messages').appendChild(div);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if (!body) return;
  input.value = '';

  const { error } = await client.from('messages').insert({ user_id: currentUserId, body });
  if (error) alert("Send error: " + error.message);
}

function subscribeRealtime() {
  client
    .channel('messages-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      renderMessage(payload.new);
      scrollToBottom();
    })
    .subscribe();
}

document.getElementById('msgInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

init();
</script>
</body>
</html>
