<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; height: 100vh; overflow: hidden; background: #f2f2f2; }
  .app { display: flex; height: 100vh; }

  /* Sidebar */
  #sidebar { width: 280px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar-header { background: #2b7de9; color: #fff; padding: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
  #sidebar-header a { color: #fff; text-decoration: none; font-size: 13px; font-weight: normal; }
  #convo-list { flex: 1; overflow-y: auto; }
  .convo-item { padding: 12px 14px; border-bottom: 1px solid #eee; cursor: pointer; }
  .convo-item:hover, .convo-item.active { background: #eef5ff; }
  .convo-name { font-weight: bold; font-size: 14px; }
  .convo-sub { font-size: 12px; color: #888; }
  .section-label { padding: 10px 14px 4px; font-size: 11px; color: #999; text-transform: uppercase; }

  /* Chat area */
  #chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header { background: #2b7de9; color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  #back-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { background: #fff; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; max-width: 75%; word-wrap: break-word; }
  .msg .name { font-size: 12px; color: #2b7de9; font-weight: bold; }
  .msg .time { font-size: 10px; color: #999; float: right; margin-left: 8px; }
  .mine { margin-left: auto; background: #dcf0ff; }
  #inputbar { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; }
  #inputbar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; min-width: 0; }
  #inputbar button { margin-left: 8px; padding: 10px 16px; background: #2b7de9; color: #fff; border: none; border-radius: 20px; flex-shrink: 0; }
  #empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; }

  /* Mobile responsive */
  @media (max-width: 700px) {
    #sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; }
    #sidebar.hide { display: none; }
    #chat-area { width: 100%; }
    #chat-area.hide { display: none; }
    #back-btn { display: inline-block; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <span>Team App</span>
      <a href="map.html">Map →</a>
    </div>
    <div id="convo-list"></div>
  </div>

  <div id="chat-area" class="hide">
    <div id="chat-header">
      <button id="back-btn" onclick="showSidebar()">←</button>
      <span id="chat-title">Chat</span>
    </div>
    <div id="messages"></div>
    <div id="inputbar">
      <input type="text" id="msgInput" placeholder="Message එකක් ලියන්න...">
      <button onclick="sendMessage()">යවන්න</button>
    </div>
  </div>

  <div id="empty-state">Chat එකක් තෝරන්න</div>
</div>

<script>
const SUPABASE_URL = "https://eszwqhemtijsymeuwgus.supabase.co";
const SUPABASE_KEY = "sb_publishable_QO6S_RY2y6wCkMHwCc6_Pg_p8XjiVby";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUserId = null;
let profileCache = {};
let allUsers = [];
let myConversations = [];
let activeConversationId = null;
let msgChannel = null;

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { window.location.href = "index.html"; return; }
  currentUserId = session.user.id;

  await loadProfiles();
  await loadMyConversations();
  renderSidebar();
  subscribeConversationUpdates();
}

async function loadProfiles() {
  const { data } = await client.from('profiles').select('id, name');
  if (data) {
    allUsers = data;
    data.forEach(p => profileCache[p.id] = p.name);
  }
}

async function loadMyConversations() {
  const { data } = await client
    .from('conversation_members')
    .select('conversation_id, conversations(id, name, is_group)')
    .eq('user_id', currentUserId);
  if (data) myConversations = data.map(d => d.conversations);
}

function otherMemberName(convo) {
  // for DMs, name is null -> resolve via members (simplified: name stored as null, we look up via cache using convo.id later)
  return convo.name;
}

async function getConvoDisplayName(convo) {
  if (convo.is_group) return convo.name || "Group";
  const { data } = await client
    .from('conversation_members')
    .select('user_id')
    .eq('conversation_id', convo.id)
    .neq('user_id', currentUserId);
  if (data && data[0]) return profileCache[data[0].user_id] || 'Unknown';
  return 'DM';
}

async function renderSidebar() {
  const list = document.getElementById('convo-list');
  list.innerHTML = '';

  const groupLabel = document.createElement('div');
  groupLabel.className = 'section-label';
  groupLabel.textContent = 'Chats';
  list.appendChild(groupLabel);

  for (const convo of myConversations) {
    const displayName = await getConvoDisplayName(convo);
    const div = document.createElement('div');
    div.className = 'convo-item' + (convo.id === activeConversationId ? ' active' : '');
    div.innerHTML = `<div class="convo-name">${displayName}</div><div class="convo-sub">${convo.is_group ? 'Group' : 'Direct message'}</div>`;
    div.onclick = () => openConversation(convo.id, displayName);
    list.appendChild(div);
  }

  const teamLabel = document.createElement('div');
  teamLabel.className = 'section-label';
  teamLabel.textContent = 'Team Members (start DM)';
  list.appendChild(teamLabel);

  for (const user of allUsers) {
    if (user.id === currentUserId) continue;
    const div = document.createElement('div');
    div.className = 'convo-item';
    div.innerHTML = `<div class="convo-name">${user.name}</div>`;
    div.onclick = () => startOrOpenDM(user.id, user.name);
    list.appendChild(div);
  }
}

async function startOrOpenDM(otherUserId, otherName) {
  // check if a DM conversation already exists between the two
  for (const convo of myConversations) {
    if (convo.is_group) continue;
    const { data } = await client
      .from('conversation_members')
      .select('user_id')
      .eq('conversation_id', convo.id);
    const memberIds = data.map(d => d.user_id);
    if (memberIds.includes(otherUserId) && memberIds.includes(currentUserId) && memberIds.length === 2) {
      openConversation(convo.id, otherName);
      return;
    }
  }

  // create new conversation
  const { data: newConvo, error } = await client
    .from('conversations')
    .insert({ is_group: false })
    .select()
    .single();

  if (error) { alert("Error: " + error.message); return; }

  await client.from('conversation_members').insert([
    { conversation_id: newConvo.id, user_id: currentUserId },
    { conversation_id: newConvo.id, user_id: otherUserId }
  ]);

  await loadMyConversations();
  await renderSidebar();
  openConversation(newConvo.id, otherName);
}

async function openConversation(convoId, title) {
  activeConversationId = convoId;
  document.getElementById('chat-title').textContent = title;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('chat-area').classList.remove('hide');

  if (window.innerWidth <= 700) {
    document.getElementById('sidebar').classList.add('hide');
  }

  await renderSidebar();
  await loadMessages(convoId);
  subscribeMessages(convoId);
}

function showSidebar() {
  document.getElementById('sidebar').classList.remove('hide');
  document.getElementById('chat-area').classList.add('hide');
}

async function loadMessages(convoId) {
  document.getElementById('messages').innerHTML = '';
  const { data } = await client
    .from('messages')
    .select('*')
    .eq('conversation_id', convoId)
    .order('created_at', { ascending: true })
    .limit(100);
  if (data) data.forEach(renderMessage);
  scrollToBottom();
}

function renderMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg' + (m.user_id === currentUserId ? ' mine' : '');
  const name = profileCache[m.user_id] || 'Unknown';
  const time = new Date(m.created_at).toLocaleTimeString('si-LK', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<div class="name">${name}</div>${escapeHtml(m.body)}<span class="time">${time}</span>`;
  document.getElementById('messages').appendChild(div);
}

function escapeHtml(text) {
  const d =
