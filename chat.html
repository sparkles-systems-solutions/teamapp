<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink: #12203B; --paper: #F7F6F2; --amber: #E8A33D; --slate: #6B7280; --line: #E4E1D8; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; background: var(--paper); color: var(--ink); }
  .app { display: flex; height: 100vh; }
  .hide { display: none !important; }

  #sidebar { width: 280px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar-header { background: var(--ink); color: #fff; padding: 16px 14px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  #sidebar-header .links { display: flex; gap: 10px; }
  #sidebar-header a { color: #fff; text-decoration: none; font-size: 12px; font-weight: 600; opacity: 0.85; }
  #convo-list { flex: 1; overflow-y: auto; }
  .convo-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .convo-item:hover { background: var(--paper); }
  .convo-item.active { background: #FAEEDA; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .avatar.amber { background: var(--amber); color: var(--ink); }
  .convo-name { font-weight: 600; font-size: 13px; }
  .convo-sub { font-size: 11px; color: var(--slate); }
  .section-label { padding: 12px 14px 4px; font-size: 10px; font-weight: 600; color: var(--slate); letter-spacing: 0.4px; }

  #right-side { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header { background: var(--ink); color: #fff; padding: 14px; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
  #back-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { background: #fff; border: 1px solid var(--line); padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; max-width: 75%; word-wrap: break-word; font-size: 13px; line-height: 1.5; }
  .msg .name { font-size: 11px; color: var(--amber); font-weight: 700; display: block; margin-bottom: 2px; }
  .msg .time { font-size: 10px; color: var(--slate); float: right; margin-left: 8px; }
  .msg .tick { font-size: 10px; margin-left: 4px; }
  .tick.sent { color: rgba(255,255,255,0.5); }
  .tick.delivered { color: rgba(255,255,255,0.7); }
  .tick.read { color: #6FD3FF; }
  .mine { margin-left: auto; background: var(--ink); color: #fff; border-color: var(--ink); }
  .mine .name { color: #FAC775; }
  .mine .time { color: rgba(255,255,255,0.6); }
  .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 6px; display: block; }
  #inputbar { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid var(--line); align-items: center; }
  #inputbar input[type=text] { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 20px; min-width: 0; font-family: inherit; font-size: 13px; background: var(--paper); }
  #inputbar input[type=text]:focus { outline: none; border-color: var(--amber); }
  #inputbar button { padding: 10px 18px; background: var(--ink); color: #fff; border: none; border-radius: 20px; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0; }
  #attach-btn { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 50%; width: 38px; height: 38px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  #empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--slate); font-size: 13px; }
  #upload-status { font-size: 11px; color: var(--slate); padding: 0 12px 8px; }

  @media (max-width: 700px) {
    #sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; }
    #right-side { width: 100%; }
    #back-btn { display: inline-block; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <span>Team App</span>
      <div class="links">
        <a href="map.html">Map →</a>
        <a href="admin.html" id="admin-link" class="hide">Admin →</a>
      </div>
    </div>
    <div id="convo-list"></div>
  </div>

  <div id="right-side">
    <div id="empty-state">Chat එකක් තෝරන්න</div>

    <div id="chat-area" class="hide">
      <div id="chat-header">
        <button id="back-btn" onclick="showSidebar()">←</button>
        <span id="chat-title">Chat</span>
      </div>
      <div id="messages"></div>
      <p id="upload-status"></p>
      <div id="inputbar">
        <button id="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="file" id="fileInput" accept="image/*,video/*" class="hide" onchange="handleFile(event)">
        <input type="text" id="msgInput" placeholder="Message එකක් ලියන්න...">
        <button onclick="sendMessage()">යවන්න</button>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://eszwqhemtijsymeuwgus.supabase.co";
const SUPABASE_KEY = "sb_publishable_QO6S_RY2y6wCkMHwCc6_Pg_p8XjiVby";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUserId = null;
let myRole = 'member';
let profileCache = {};
let allUsers = [];
let myConversations = [];
let activeConversationId = null;
let msgChannel = null;
let readsChannel = null;
let readsByMessage = {};
let otherMembersCount = 0;

function initials(name) {
  return (name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

async function init() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) { window.location.href = "index.html"; return; }
  currentUserId = session.user.id;

  const { data: me } = await client.from('profiles').select('role').eq('id', currentUserId).single();
  myRole = me?.role || 'member';
  if (myRole === 'admin') document.getElementById('admin-link').classList.remove('hide');

  await loadProfiles();
  await loadMyConversations();
  await renderSidebar();
  subscribeConversationUpdates();
}

async function loadProfiles() {
  // RLS now restricts this: admin sees everyone, member sees only self + admin
  const { data } = await client.from('profiles').select('id, name, role');
  if (data) {
    allUsers = data;
    data.forEach(p => profileCache[p.id] = p.name);
  }
}

async function loadMyConversations() {
  const { data } = await client
    .from('conversation_members')
    .select('conversation_id, conversations(id, name, is_group)')
    .eq('user_id', currentUserId);
  if (data) myConversations = data.map(d => d.conversations).filter(Boolean);
}

async function getConvoDisplayName(convo) {
  if (convo.is_group) return convo.name || "Group";
  const { data } = await client
    .from('conversation_members')
    .select('user_id')
    .eq('conversation_id', convo.id)
    .neq('user_id', currentUserId);
  if (data && data[0]) return profileCache[data[0].user_id] || 'Unknown';
  return 'DM';
}

async function renderSidebar() {
  const list = document.getElementById('convo-list');
  list.innerHTML = '';

  const groupLabel = document.createElement('div');
  groupLabel.className = 'section-label';
  groupLabel.textContent = 'CHATS';
  list.appendChild(groupLabel);

  for (const convo of myConversations) {
    const displayName = await getConvoDisplayName(convo);
    const div = document.createElement('div');
    div.className = 'convo-item' + (convo.id === activeConversationId ? ' active' : '');
    div.innerHTML = `<div class="avatar">${convo.is_group ? 'T' : initials(displayName)}</div>
      <div><div class="convo-name">${displayName}</div><div class="convo-sub">${convo.is_group ? 'Group' : 'Direct message'}</div></div>`;
    div.onclick = () => openConversation(convo.id, displayName);
    list.appendChild(div);
  }

  // Admin only: browse all members to start a new DM. Members never see this list —
  // their only DM (with admin) already exists in "Chats" above.
  if (myRole === 'admin') {
    const teamLabel = document.createElement('div');
    teamLabel.className = 'section-label';
    teamLabel.textContent = 'ALL MEMBERS';
    list.appendChild(teamLabel);

    for (const user of allUsers) {
      if (user.id === currentUserId) continue;
      const div = document.createElement('div');
      div.className = 'convo-item';
      div.innerHTML = `<div class="avatar amber">${initials(user.name)}</div>
        <div class="convo-name" style="flex:1;">${user.name}</div>
        <a href="map.html?focus=${user.id}" style="text-decoration:none; font-size:14px; padding:4px;" title="Location බලන්න">📍</a>`;
      div.onclick = (e) => { if (e.target.tagName !== 'A') startOrOpenDM(user.id, user.name); };
      list.appendChild(div);
    }
  }
}

async function startOrOpenDM(otherUserId, otherName) {
  for (const convo of myConversations) {
    if (convo.is_group) continue;
    const { data } = await client
      .from('conversation_members')
      .select('user_id')
      .eq('conversation_id', convo.id);
    const memberIds = data.map(d => d.user_id);
    if (memberIds.includes(otherUserId) && memberIds.includes(currentUserId) && memberIds.length === 2) {
      openConversation(convo.id, otherName);
      return;
    }
  }

  const { data: newConvoId, error } = await client.rpc('create_dm', { other_user: otherUserId });
  if (error) { alert("Error: " + error.message); return; }

  await loadMyConversations();
  await renderSidebar();
  openConversation(newConvoId, otherName);
}

async function openConversation(convoId, title) {
  activeConversationId = convoId;
  document.getElementById('chat-title').textContent = title;
  document.getElementById('empty-state').classList.add('hide');
  document.getElementById('chat-area').classList.remove('hide');

  if (window.innerWidth <= 700) {
    document.getElementById('sidebar').classList.add('hide');
  }

  const { count } = await client
    .from('conversation_members')
    .select('*', { count: 'exact', head: true })
    .eq('conversation_id', convoId)
    .neq('user_id', currentUserId);
  otherMembersCount = count || 0;

  await renderSidebar();
  await loadMessages(convoId);
  subscribeMessages(convoId);
  subscribeReads(convoId);
}

function showSidebar() {
  document.getElementById('sidebar').classList.remove('hide');
}

async function loadMessages(convoId) {
  document.getElementById('messages').innerHTML = '';
  readsByMessage = {};

  const { data } = await client
    .from('messages')
    .select('*')
    .eq('conversation_id', convoId)
    .order('created_at', { ascending: true })
    .limit(100);

  if (data && data.length) {
    const ids = data.map(m => m.id);
    const { data: reads } = await client
      .from('message_reads')
      .select('message_id, user_id')
      .in('message_id', ids);
    if (reads) {
      reads.forEach(r => {
        if (!readsByMessage[r.message_id]) readsByMessage[r.message_id] = new Set();
        readsByMessage[r.message_id].add(r.user_id);
      });
    }
    data.forEach(renderMessage);
    scrollToBottom();
    await markOthersAsRead(data.filter(m => m.user_id !== currentUserId).map(m => m.id), convoId);
  }
}

async function markOthersAsRead(messageIds, convoId) {
  if (!messageIds.length) return;
  const rows = messageIds.map(id => ({ message_id: id, conversation_id: convoId, user_id: currentUserId }));
  await client.from('message_reads').upsert(rows, { onConflict: 'message_id,user_id', ignoreDuplicates: true });
}

function tickHtml(messageId) {
  const readers = readsByMessage[messageId] ? readsByMessage[messageId].size : 0;
  if (readers >= otherMembersCount && otherMembersCount > 0) return `<span class="tick read">✓✓</span>`;
  if (readers > 0) return `<span class="tick delivered">✓✓</span>`;
  return `<span class="tick sent">✓</span>`;
}

function attachmentHtml(m) {
  if (!m.attachment_url) return '';
  if (m.attachment_type === 'video') return `<video src="${m.attachment_url}" controls></video>`;
  return `<img src="${m.attachment_url}" alt="attachment">`;
}

function renderMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg' + (m.user_id === currentUserId ? ' mine' : '');
  div.dataset.msgId = m.id;
  const name = profileCache[m.user_id] || 'Unknown';
  const time = new Date(m.created_at).toLocaleTimeString('si-LK', { hour: '2-digit', minute: '2-digit' });
  const tick = m.user_id === currentUserId ? tickHtml(m.id) : '';
  div.innerHTML = `<span class="name">${name}</span>${m.body ? escapeHtml(m.body) : ''}${attachmentHtml(m)}<span class="time">${time}${tick}</span>`;
  document.getElementById('messages').appendChild(div);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function scrollToBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  if (!activeConversationId) return;
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if (!body) return;
  input.value = '';

  const { error } = await client.from('messages').insert({
    user_id: currentUserId,
    body,
    conversation_id: activeConversationId
  });
  if (error) alert("Send error: " + error.message);
}

async function handleFile(event) {
  const file = event.target.files[0];
  if (!file || !activeConversationId) return;

  const statusEl = document.getElementById('upload-status');
  const maxSizeMB = 25;
  if (file.size > maxSizeMB * 1024 * 1024) {
    alert(`File එක ${maxSizeMB}MB ට වඩා loku — කුඩා file එකක් තෝරන්න`);
    event.target.value = '';
    return;
  }

  const isVideo = file.type.startsWith('video/');
  const isImage = file.type.startsWith('image/');
  if (!isVideo && !isImage) { alert("Image හෝ video file එකක් විතරයි"); return; }

  statusEl.textContent = "Upload වෙමින්...";

  const ext = file.name.split('.').pop();
  const path = `${currentUserId}/${Date.now()}.${ext}`;

  const { error: upErr } = await client.storage.from('chat-media').upload(path, file);
  if (upErr) { statusEl.textContent = ""; alert("Upload error: " + upErr.message); return; }

  const { data: urlData } = client.storage.from('chat-media').getPublicUrl(path);

  const { error: msgErr } = await client.from('messages').insert({
    user_id: currentUserId,
    body: null,
    conversation_id: activeConversationId,
    attachment_url: urlData.publicUrl,
    attachment_type: isVideo ? 'video' : 'image'
  });

  statusEl.textContent = "";
  event.target.value = '';
  if (msgErr) alert("Send error: " + msgErr.message);
}

function subscribeMessages(convoId) {
  if (msgChannel) client.removeChannel(msgChannel);
  msgChannel = client
    .channel('messages-' + convoId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convoId}` }, async (payload) => {
      renderMessage(payload.new);
      scrollToBottom();
      if (payload.new.user_id !== currentUserId) {
        await markOthersAsRead([payload.new.id], convoId);
      }
    })
    .subscribe();
}

function subscribeReads(convoId) {
  if (readsChannel) client.removeChannel(readsChannel);
  readsChannel = client
    .channel('reads-' + convoId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'message_reads', filter: `conversation_id=eq.${convoId}` }, (payload) => {
      const { message_id, user_id } = payload.new;
      if (!readsByMessage[message_id]) readsByMessage[message_id] = new Set();
      readsByMessage[message_id].add(user_id);

      const msgEl = document.querySelector(`.msg[data-msg-id="${message_id}"] .tick`);
      if (msgEl) {
        const readers = readsByMessage[message_id].size;
        msgEl.className = 'tick ' + (readers >= otherMembersCount && otherMembersCount > 0 ? 'read' : 'delivered');
      }
    })
    .subscribe();
}

function subscribeConversationUpdates() {
  client
    .channel('convo-updates')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'conversation_members', filter: `user_id=eq.${currentUserId}` }, async () => {
      await loadMyConversations();
      renderSidebar();
    })
    .subscribe();
}

document.getElementById('msgInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

init();
</script>
</body>
</html>
